name: 06 Code Comment Generation BiLSTM Attention CI

on:
  push:
    paths:
      - "06-code-comment-generation-bilstm-attention/**"
      - ".github/workflows/06-code-comment-generation-bilstm-attention.yml"
  pull_request:
    paths:
      - "06-code-comment-generation-bilstm-attention/**"
      - ".github/workflows/06-code-comment-generation-bilstm-attention.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-code-comment-generation-bilstm-attention

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 06-code-comment-generation-bilstm-attention/requirements*.txt

      - name: Install lightweight CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Compile Python files
        run: python -m compileall app src scripts tests

      - name: Run unit tests
        run: pytest -q

      - name: Validate inference pipeline import
        run: python -c "from src.inference_pipeline import CodeCommentInferencePipeline; print('Inference import OK')"

      - name: Validate Streamlit app import
        run: python -c "import app.streamlit_app; print('Streamlit app import OK')"

      - name: Validate artifact manifest
        run: python scripts/validate_project.py --ci
