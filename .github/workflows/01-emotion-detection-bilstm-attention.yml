name: 01 Emotion Detection BiLSTM Attention CI

on:
  push:
    paths:
      - "01-emotion-detection-bilstm-attention/**"
      - ".github/workflows/01-emotion-detection-bilstm-attention.yml"
  pull_request:
    paths:
      - "01-emotion-detection-bilstm-attention/**"
      - ".github/workflows/01-emotion-detection-bilstm-attention.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: 01-emotion-detection-bilstm-attention

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            01-emotion-detection-bilstm-attention/requirements.txt
            01-emotion-detection-bilstm-attention/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Compile Python files
        run: python -m compileall app src scripts tests

      - name: Run lightweight tests
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: pytest -q

      - name: Validate Streamlit app import
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: python -c "import app.streamlit_app; print('Streamlit app import passed')"

      - name: Validate project structure
        run: python scripts/validate_project.py

# The workflow intentionally does not train the neural network.
