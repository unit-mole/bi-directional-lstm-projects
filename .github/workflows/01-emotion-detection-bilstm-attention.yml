name: 01 Emotion Detection BiLSTM Attention CI
run-name: 01 Emotion Detection BiLSTM Attention CI
on:
  push:
    branches: [main]
    paths:
      - "01-emotion-detection-bilstm-attention/**"
      - ".github/workflows/01-emotion-detection-bilstm-attention.yml"
  pull_request:
    branches: [main]
    paths:
      - "01-emotion-detection-bilstm-attention/**"
      - ".github/workflows/01-emotion-detection-bilstm-attention.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 01-emotion-detection-bilstm-attention
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 01-emotion-detection-bilstm-attention/app/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt
          python -m pip install pytest
      - name: Compile source
        run: python -m compileall -q app src scripts tests
      - name: Validate artifacts
        run: python scripts/validate_project.py
      - name: Run tests
        run: python -m pytest -q
      - name: Validate Streamlit syntax
        run: python -m py_compile app/streamlit_app.py
