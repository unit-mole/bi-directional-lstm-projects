name: 03 Named Entity Recognition BiLSTM CRF CI

on:
  push:
    paths:
      - "03-named-entity-recognition-bilstm-crf/**"
      - ".github/workflows/03-named-entity-recognition-bilstm-crf.yml"
  pull_request:
    paths:
      - "03-named-entity-recognition-bilstm-crf/**"
      - ".github/workflows/03-named-entity-recognition-bilstm-crf.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 03-named-entity-recognition-bilstm-crf

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            03-named-entity-recognition-bilstm-crf/requirements.txt
            03-named-entity-recognition-bilstm-crf/requirements-dev.txt

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project and test dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile Python files
        run: python -m compileall app src scripts tests

      - name: Run lightweight project validation
        run: python scripts/validate_project.py --skip-model-load

      - name: Run tests
        run: pytest -q -m "not slow"

      - name: Validate inference pipeline import
        run: python -c "from src.inference_pipeline import NERInferencePipeline; print('Inference import OK')"

      - name: Validate Streamlit app import
        run: python -c "import app.streamlit_app; print('Streamlit app import OK')"

      - name: Confirm full training is not executed in CI
        run: echo "CI validates code and artifacts only; it does not retrain the model."
