name: 02 Medical Text Classification BiLSTM Attention CI

on:
  push:
    paths:
      - "02-medical-text-classification-bilstm-attention/**"
      - ".github/workflows/02-medical-text-classification-bilstm-attention.yml"
  pull_request:
    paths:
      - "02-medical-text-classification-bilstm-attention/**"
      - ".github/workflows/02-medical-text-classification-bilstm-attention.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medical-text-bilstm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: 02-medical-text-classification-bilstm-attention

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            02-medical-text-classification-bilstm-attention/requirements.txt
            02-medical-text-classification-bilstm-attention/requirements-dev.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Compile Python source
        run: |
          python -m compileall app src scripts tests

      - name: Validate saved artifact contract
        run: |
          python scripts/validate_artifacts.py --metadata-only

      - name: Run lightweight tests
        run: |
          pytest -q -m "not model"

      - name: Validate Streamlit app import
        run: |
          python -c "import importlib.util, pathlib; p=pathlib.Path('app/streamlit_app.py'); s=importlib.util.spec_from_file_location('streamlit_app', p); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); assert callable(m.main)"
